[package]
name = "app-uninstaller"
version = "0.1.1"
description = "Windows 应用卸载器"
license = "MIT"
edition = "2021"

[lib]
name = "app_uninstaller_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
winreg = "0.55"
sysinfo = "0.33"
trash = "5"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_System_Environment",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
] }
ureq = { version = "2", default-features = false, features = ["native-tls", "json"] }
png = "0.17"
base64 = "0.22"

[profile.release]
opt-level = "s"
lto = true
strip = true
