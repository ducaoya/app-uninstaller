name: Release

on:
  push:
    branches: [master]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    # 只有提交信息以【release】开头时（或手动触发）才构建发布
    if: |
      github.event_name == 'workflow_dispatch' ||
      startsWith(github.event.head_commit.message, '【release】')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      # 发布说明取自提交信息正文（去掉标题行），保证 Release 里写清本次改动
      - name: Extract release notes
        id: notes
        shell: bash
        run: |
          {
            echo 'body<<__NOTES_EOF__'
            git log -1 --pretty=%B | tail -n +2 | sed -e '/./,$!d' -e :a -e '/^\n*$/{$d;N;ba' -e '}'
            echo '__NOTES_EOF__'
          } >> "$GITHUB_OUTPUT"

      - name: Build and publish release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: v__VERSION__
          releaseName: App Uninstaller v__VERSION__
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          args: ""
